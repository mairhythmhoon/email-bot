# Developed By github.com/@mairhythmhoon

name: Monthly Log Cleanup

on:
  # Runs on 1st day of every month at 6:00 AM IST
  schedule:
    - cron: "30 0 1 * *"

  # Manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  cleanup_logs:
    # Extra protection:
    # Runs ONLY for schedule or manual trigger
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    name: Clear old log files
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    permissions:
      contents: write

    steps:
      # Show trigger information
      - name: Show trigger info
        run: |
          echo "Triggered by: ${{ github.event_name }}"
          echo "UTC Time: $(date -u)"
          echo "IST Time: $(TZ=Asia/Kolkata date)"

      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # Cleanup old logs but preserve last 10 lines
      - name: Clean log files
        run: |
          if [ ! -d "Logs" ]; then
            echo "Logs folder not found."
            exit 0
          fi

          IST_TIME=$(TZ=Asia/Kolkata date "+%d-%m-%Y %I:%M:%S %p IST")

          find Logs -type f -name "*.log" | while read -r file; do

            TEMP_FILE=$(mktemp)

            {
              echo "========================================"
              echo "Old logs cleaned by monthly scheduler"
              echo "Cleanup Time: $IST_TIME"
              echo "========================================"
              echo ""

              # Keep only latest 10 lines
              tail -n 10 "$file"
            } > "$TEMP_FILE"

            mv "$TEMP_FILE" "$file"

            echo "Cleaned: $file"
          done

      # Commit changes only if needed
      - name: Commit changes
        run: |
          git config --global user.name "mairhythmhoon"
          git config --global user.email "rhythm.work.id@proton.me"

          git add Logs/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Monthly cleanup of log files"
          fi

      # Push updated files
      - name: Push changes
        run: git push